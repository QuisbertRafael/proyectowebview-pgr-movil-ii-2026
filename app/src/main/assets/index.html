<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>WebBridge UCB</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/bridge.js" defer></script>
</head>
<body>
  <main class="panel">
    <h1>WebBridge UCB</h1>
    <p>HTML + JavaScript dentro de un WebView Android, con arquitectura MVVM.</p>
    <label for="webInput">Mensaje desde JavaScript</label>
    <textarea id="webInput" maxlength="2000" placeholder="Escribe un mensaje para Kotlin..."></textarea>
    <div class="actions">
      <button id="sendButton" type="button">Enviar a Android</button>
      <button id="clearButton" class="secondary" type="button">Limpiar ambos</button>
    </div>
    <div id="status" role="status" aria-live="polite">Página JavaScript lista.</div>
    <h2>Historial de la página</h2>
    <ul id="history" aria-label="Mensajes intercambiados"></ul>
  </main>
</body>
</html>
