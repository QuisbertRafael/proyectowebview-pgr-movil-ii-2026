<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>WebBridge UCB</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/bridge.js" defer></script>
</head>
<body>
  <main>
    <h1>Web → Android</h1>
    <p id="pageContext" class="byline">HTML / JavaScript</p>
    <p class="byline">URL para el navegador <code id="pageUrl"></code></p>

    <label for="webInput">Mensaje para el Request</label>
    <div class="controls">
      <input id="webInput" type="text" maxlength="2000" autocomplete="off">
      <button id="requestButton" type="button">Request</button>
    </div>

    <label for="eventAction">Acción del Event</label>
    <div class="controls">
      <select id="eventAction">
        <option value="open_camera">Abrir cámara</option>
        <option value="open_menu">Abrir menú Android</option>
        <option value="show_toast">Mostrar aviso Android</option>
      </select>
      <button id="eventButton" type="button" class="secondary">Enviar Event</button>
    </div>

    <p id="status" role="status" aria-live="polite">Página local lista.</p>
    <p id="pendingRequest" class="byline">Web por responder: 0 · Android por responder: 0</p>

    <p id="eventBanner" class="feedback" role="status" hidden>Android envió un aviso a la web.</p>
    <section id="eventPanel" class="feedback" aria-labelledby="eventPanelTitle" hidden>
      <h2 id="eventPanelTitle">Panel web</h2>
      <p>Android abrió este panel mediante un Event.</p>
      <button id="closePanel" type="button" class="secondary">Cerrar panel</button>
    </section>
  </main>
</body>
</html>
